<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060d0b;
    --bg-alt: #0a1613;
    --surface: #0f1e1a;
    --surface-2: #143128;
    --line: rgba(143, 240, 222, 0.14);
    --teal: #3fd9c4;
    --teal-light: #8ff0de;
    --silver: #e7ecea;
    --silver-dim: #9bb0ac;
    --white: #f5fbfa;
    --grad: linear-gradient(135deg, #e7ecea 0%, #3fd9c4 55%, #1f8f7e 100%);
    --shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--white);
    font-family: 'Public Sans', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  ::selection { background: var(--teal); color: var(--bg); }

  :focus-visible{
    outline: 2px solid var(--teal-light);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal-light);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before{
    content: '';
    width: 18px;
    height: 1px;
    background: var(--teal-light);
    display: inline-block;
  }

  /* ---------- background thread signature ---------- */
  .thread-svg{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }
  .thread-path{
    fill: none;
    stroke: url(#threadGrad);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 12 10;
    animation: dash-flow 40s linear infinite;
  }
  @keyframes dash-flow{
    to { stroke-dashoffset: -2000; }
  }

  /* ---------- header ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    background: rgba(6, 13, 11, 0.72);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .brand-mark{
    width: 38px;
    height: 38px;
    flex-shrink: 0;
  }
  .brand small{
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--silver-dim);
    text-transform: uppercase;
  }
  nav.links{
    display: flex;
    gap: 32px;
    font-size: 14.5px;
    color: var(--silver-dim);
  }
  nav.links a:hover{ color: var(--teal-light); }
  .cta-btn{
    background: var(--grad);
    color: #06120f;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform .25s ease, box-shadow .25s ease;
    box-shadow: 0 8px 24px rgba(63, 217, 196, 0.25);
  }
  .cta-btn:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(63, 217, 196, 0.4); }
  .cta-ghost{
    border: 1px solid var(--line);
    color: var(--silver);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
  }
  .cta-ghost:hover{ border-color: var(--teal); color: var(--teal-light); }

  .menu-toggle{ display: none; background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; }

  /* ---------- hero ---------- */
  .hero{
    position: relative;
    padding: 110px 0 90px;
    z-index: 1;
  }
  .hero-grid{
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 48px;
    align-items: center;
  }
  .hero h1{
    font-size: clamp(34px, 5.2vw, 58px);
    line-height: 1.06;
    margin: 18px 0 22px;
  }
  .hero h1 .grad-text{
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p.lead{
    font-size: 17.5px;
    color: var(--silver-dim);
    max-width: 480px;
    margin-bottom: 34px;
  }
  .hero-actions{ display: flex; gap: 14px; flex-wrap: wrap; }
  .hero-stats{
    display: flex;
    gap: 32px;
    margin-top: 46px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .hero-stats div strong{
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    color: var(--teal-light);
  }
  .hero-stats div span{
    font-size: 12.5px;
    color: var(--silver-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .hero-visual{
    position: relative;
    aspect-ratio: 1/1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-visual .ring{
    position: absolute;
    border: 1px solid var(--line);
    border-radius: 50%;
  }
  .hero-visual .ring.r1{ inset: 0; }
  .hero-visual .ring.r2{ inset: 14%; border-style: dashed; opacity: .5; }
  .hero-mark{
    width: 46%;
    filter: drop-shadow(0 20px 50px rgba(63,217,196,0.28));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-14px); }
  }

  /* ---------- section shell ---------- */
  section{ position: relative; z-index: 1; padding: 88px 0; }
  .section-head{ max-width: 620px; margin-bottom: 52px; }
  .section-head h2{ font-size: clamp(28px, 3.6vw, 40px); margin-top: 14px; }
  .section-head p{ color: var(--silver-dim); font-size: 16px; margin-top: 14px; }

  /* ---------- niche / para quem é ---------- */
  .niche{ padding: 56px 0 0; }
  .niche-row{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 22px;
  }
  .niche-tag{
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--silver);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14.5px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .niche-tag::before{ content:''; width:7px; height:7px; border-radius:50%; background: var(--teal); flex-shrink:0; }

  /* ---------- antes/depois ---------- */
  .compare-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .compare-card{
    border-radius: 20px;
    padding: 30px 26px;
    border: 1px solid var(--line);
  }
  .compare-card.before{ background: var(--surface); opacity: .88; }
  .compare-card.after{ background: linear-gradient(180deg, rgba(63,217,196,0.1), var(--surface) 55%); border-color: var(--teal); box-shadow: var(--shadow); }
  .compare-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 18px;
  }
  .compare-card.before .compare-label{ background: rgba(231,236,234,0.08); color: var(--silver-dim); }
  .compare-card.after .compare-label{ background: var(--grad); color: #06120f; font-weight: 600; }
  .compare-card h3{ font-size: 21px; margin-bottom: 16px; }
  .compare-card ul{ list-style: none; display: grid; gap: 12px; }
  .compare-card li{ font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; }
  .compare-card.before li{ color: var(--silver-dim); }
  .compare-card.before li::before{ content:'✕'; color:#e07a6b; flex-shrink:0; font-weight:700; }
  .compare-card.after li{ color: var(--silver); }
  .compare-card.after li::before{ content:'✓'; color: var(--teal); flex-shrink:0; font-weight:700; }

  /* ---------- garantia ---------- */
  .guarantee{
    margin-top: 40px;
    background: linear-gradient(120deg, rgba(63,217,196,0.14), rgba(63,217,196,0.03));
    border: 1px solid var(--teal);
    border-radius: 18px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .guarantee svg{ flex-shrink: 0; width: 30px; height: 30px; }
  .guarantee strong{ font-family: 'Space Grotesk', sans-serif; font-size: 17px; display:block; }
  .guarantee span{ color: var(--silver-dim); font-size: 14px; }

  /* ---------- o que não inclui ---------- */
  .not-included{
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 30px;
  }
  .not-included h4{ font-size: 15px; margin-bottom: 14px; color: var(--silver-dim); font-family: 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; font-weight:500; }
  .not-included ul{ list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 24px; }
  .not-included li{ font-size: 14px; color: var(--silver-dim); display: flex; gap: 10px; }
  .not-included li::before{ content:'—'; color: var(--teal); flex-shrink:0; }

  /* ---------- FAQ ---------- */
  .faq-list{ display: grid; gap: 14px; max-width: 780px; }
  .faq-item{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px 24px;
  }
  .faq-item summary{
    cursor: pointer;
    padding: 20px 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16.5px;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .faq-item summary::-webkit-details-marker{ display: none; }
  .faq-item summary::after{
    content: '+';
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--teal-light);
    flex-shrink: 0;
    transition: transform .25s ease;
  }
  .faq-item[open] summary::after{ transform: rotate(45deg); }
  .faq-item p{ color: var(--silver-dim); font-size: 14.5px; padding-bottom: 20px; max-width: 640px; }

  /* ---------- problems ---------- */
  .problems{ background: linear-gradient(180deg, transparent, var(--bg-alt) 20%, var(--bg-alt) 80%, transparent); }
  .problem-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .problem-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 26px;
    transition: transform .3s ease, border-color .3s ease;
  }
  .problem-card:hover{ transform: translateY(-6px); border-color: var(--teal); }
  .problem-card .num{
    font-family: 'JetBrains Mono', monospace;
    color: var(--teal);
    font-size: 13px;
    letter-spacing: 0.1em;
  }
  .problem-card h3{ font-size: 19px; margin: 14px 0 10px; }
  .problem-card p{ color: var(--silver-dim); font-size: 14.5px; }

  /* ---------- process ---------- */
  .process-list{
    display: grid;
    gap: 0;
  }
  .process-item{
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 24px;
    padding: 26px 0;
    border-bottom: 1px solid var(--line);
  }
  .process-item:first-child{ border-top: 1px solid var(--line); }
  .step-num{
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--teal-light);
    padding-top: 3px;
  }
  .process-item h3{ font-size: 19px; margin-bottom: 6px; }
  .process-item p{ color: var(--silver-dim); font-size: 15px; max-width: 620px; }

  /* ---------- pricing ---------- */
  .pricing-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    align-items: stretch;
  }
  .plan{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 34px 28px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .plan.featured{
    border-color: var(--teal);
    background: linear-gradient(180deg, rgba(63,217,196,0.09), var(--surface) 40%);
    box-shadow: var(--shadow);
  }
  .plan.featured::before{
    content: 'MAIS ESCOLHIDO';
    position: absolute;
    top: -13px;
    left: 28px;
    background: var(--grad);
    color: #06120f;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    padding: 5px 12px;
    border-radius: 999px;
    font-weight: 600;
  }
  .plan .plan-name{ font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: var(--silver-dim); text-transform: uppercase; }
  .plan .plan-price{ font-family: 'Space Grotesk', sans-serif; font-size: 42px; margin: 12px 0 4px; }
  .plan .plan-price sup{ font-size: 18px; color: var(--teal-light); }
  .plan .plan-tag{ font-size: 13.5px; color: var(--silver-dim); margin-bottom: 22px; }
  .plan ul{ list-style: none; display: grid; gap: 12px; margin-bottom: 28px; flex-grow: 1; }
  .plan ul li{
    font-size: 14.5px;
    color: var(--silver);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .plan ul li::before{
    content: '✓';
    color: var(--teal);
    font-weight: 700;
    flex-shrink: 0;
  }
  .plan .plan-cta{
    text-align: center;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid var(--teal);
    color: var(--teal-light);
    font-weight: 600;
    font-size: 14.5px;
  }
  .plan.featured .plan-cta{
    background: var(--grad);
    color: #06120f;
    border: none;
  }
  .plan .plan-cta:hover{ opacity: .85; }

  .extras{
    margin-top: 40px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 30px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .extras .extra-item h4{ font-size: 15px; margin-bottom: 4px; }
  .extras .extra-item span{ color: var(--teal-light); font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
  .extras .extra-item p{ color: var(--silver-dim); font-size: 13px; margin-top: 4px; }

  /* ---------- portfolio / social proof ---------- */
  .social{
    background: var(--bg-alt);
  }
  .social-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .ig-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px;
  }
  .ig-head{ display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .ig-head img{ width: 42px; height: 42px; border-radius: 50%; }
  .ig-head strong{ font-size: 14.5px; }
  .ig-head span{ display: block; font-size: 12.5px; color: var(--silver-dim); }
  .ig-stats{ display: flex; gap: 24px; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--silver-dim); }
  .ig-stats strong{ color: var(--white); display: block; font-family: 'Space Grotesk', sans-serif; font-size: 18px; }

  /* ---------- final cta ---------- */
  .final-cta{
    text-align: center;
    padding: 100px 0 120px;
  }
  .final-cta h2{ font-size: clamp(30px, 5vw, 50px); max-width: 720px; margin: 0 auto 20px; }
  .final-cta p{ color: var(--silver-dim); max-width: 480px; margin: 0 auto 34px; }

  footer{
    border-top: 1px solid var(--line);
    padding: 40px 0;
    position: relative;
    z-index: 1;
  }
  .foot-grid{ display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
  .foot-brand{ display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
  .foot-brand img{ width: 28px; height: 28px; }
  .foot-links{ display: flex; gap: 22px; font-size: 13.5px; color: var(--silver-dim); }
  .foot-links a:hover{ color: var(--teal-light); }

  @media (max-width: 860px){
    .hero-grid{ grid-template-columns: 1fr; }
    .hero-visual{ max-width: 280px; margin: 0 auto; }
    .problem-grid{ grid-template-columns: 1fr; }
    .pricing-grid{ grid-template-columns: 1fr; }
    .social-grid{ grid-template-columns: 1fr; }
    .extras{ grid-template-columns: 1fr; }
    .compare-grid{ grid-template-columns: 1fr; }
    .not-included ul{ grid-template-columns: 1fr; }
    .guarantee{ flex-direction: column; align-items: flex-start; }
    nav.links{ display: none; }
    .menu-toggle{ display: block; }
    .cta-ghost{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<svg class="thread-svg" viewBox="0 0 1200 2400" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7ecea"/>
      <stop offset="55%" stop-color="#3fd9c4"/>
      <stop offset="100%" stop-color="#1f8f7e"/>
    </linearGradient>
  </defs>
  <path class="thread-path" d="M -100 120 C 300 220, 250 420, 650 480 S 1100 700, 700 900 S 200 1150, 600 1350 S 1150 1600, 750 1850 S 150 2100, 550 2350" />
</svg>

<header>
  <div class="nav wrap">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" role="img" aria-label="Synth Solutions logomark">
        <defs>
          <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e7ecea"/>
            <stop offset="55%" stop-color="#3fd9c4"/>
            <stop offset="100%" stop-color="#1f8f7e"/>
          </linearGradient>
        </defs>
        <path d="M32 22c-10 0-16 6-16 13 0 18 30 10 30 24 0 6-6 10-14 10-8 0-15-4-17-11" fill="none" stroke="url(#markGrad)" stroke-width="7" stroke-linecap="round"/>
        <path d="M46 22 L66 50 L86 22 M66 50 L66 82" fill="none" stroke="url(#markGrad)" stro
